name: Desktop PyQt6 Cross-Platform

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/desktop-python.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/desktop-python.yml'
  workflow_dispatch:

jobs:
  portable-source-check:
    name: ${{ matrix.os }} PyQt6 source check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install PyQt6 runtime
        run: python -m pip install -r windows/requirements.txt
      - name: Verify PyQt6 imports
        run: python -c "from PyQt6.QtWidgets import QApplication; print('PyQt6 import OK')"
      - name: Portable compile and deterministic tests
        run: python windows/build_desktop.py --check
