name: Android APK

# Versioned Android CI/CD pipeline for Aurum Edge.
# It installs every build prerequisite explicitly, validates the Gradle wrapper, runs lint/tests,
# builds debug + release APKs, creates updater metadata, and can publish a signed GitHub Release.
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths:
      - 'android/**'
      - 'update/**'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'update/**'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional app versionName for this run, for example 1.2.10. Blank = use android/app/build.gradle.kts.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Optional numeric versionCode for this run. Blank = use android/app/build.gradle.kts.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish/refresh GitHub Release assets for the in-app updater. Requires stable signing secrets.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# All runner/tool versions are declared here so upgrades are intentional and visible.
env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_CMDLINE_TOOLS: latest
  PROJECT_DIR: android
  APP_MODULE: app
  APPLICATION_ID: com.aurum.edge
  RELEASE_APK_PREFIX: AurumEdge
  # Public signing certificate independently verified on immutable #403 and #405 release APKs.
  # This pins the user-selected #403 channel, not a certificate read from any phone.
  UPDATER_CERT_SHA256: '137f3f98f6c85fdd8671d1d2099b095ed82f3f91594ac9e7b1ba22c264ed4a04'
  GRADLE_FLAGS: --no-daemon --stacktrace --warning-mode=all

jobs:
  apk:
    name: Build, test, package APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Optional stable release signing secrets. In-app updates require the same signing key every time.
      AURUM_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURUM_RELEASE_KEYSTORE_BASE64 }}
      AURUM_RELEASE_STORE_PASSWORD: ${{ secrets.AURUM_RELEASE_STORE_PASSWORD }}
      AURUM_RELEASE_KEY_ALIAS: ${{ secrets.AURUM_RELEASE_KEY_ALIAS }}
      AURUM_RELEASE_KEY_PASSWORD: ${{ secrets.AURUM_RELEASE_KEY_PASSWORD }}
      AURUM_RELEASE_STORE_TYPE: ${{ secrets.AURUM_RELEASE_STORE_TYPE }}
      CI_SIGNING_CACHE_DIR: /home/runner/.aurum-ci-signing
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Android project
        id: guard
        run: |
          set -euo pipefail
          if [[ -d "$PROJECT_DIR" && -f "$PROJECT_DIR/gradlew" && -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK — skipped"
              echo "The Android project was not found on this ref."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [[ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "::error title=Android SDK missing::sdkmanager was not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Validate Gradle wrapper
        if: steps.guard.outputs.ready == 'true'
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle cache
        if: steps.guard.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Resolve and validate app version
        if: steps.guard.outputs.ready == 'true'
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '' }}
          INPUT_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '' }}
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          PROJECT_VERSION_NAME=$(grep -m1 'versionName = ' "$BUILD_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          PROJECT_VERSION_CODE=$(grep -m1 'versionCode = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME="${INPUT_VERSION_NAME:-$PROJECT_VERSION_NAME}"
          if [[ -n "$INPUT_VERSION_CODE" ]]; then
            VERSION_CODE="$INPUT_VERSION_CODE"
          else
            # PR checks must also have a code greater than the already-published APK,
            # otherwise their signing-continuity gate fails after a successful release.
            VERSION_CODE="$PROJECT_VERSION_CODE"
            if [[ "${GITHUB_RUN_NUMBER}" =~ ^[1-9][0-9]*$ && "$GITHUB_RUN_NUMBER" -gt "$VERSION_CODE" ]]; then
              VERSION_CODE="$GITHUB_RUN_NUMBER"
            fi
          fi
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid versionName::Use a semantic version such as 1.2.10"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid versionCode::versionCode must be a positive integer"
            exit 1
          fi
          if [[ "$VERSION_NAME" != "$PROJECT_VERSION_NAME" ]]; then
            sed -i -E "0,/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/s//versionName = \"${VERSION_NAME}\"/" "$BUILD_FILE"
          fi
          if [[ "$VERSION_CODE" != "$PROJECT_VERSION_CODE" ]]; then
            sed -i -E "0,/versionCode[[:space:]]*=[[:space:]]*[0-9]+/s//versionCode = ${VERSION_CODE}/" "$BUILD_FILE"
          fi
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
            echo "tag=v$VERSION_NAME"
            echo "apk_name=${RELEASE_APK_PREFIX}-v${VERSION_NAME}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify project SDK configuration
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          COMPILE_SDK=$(grep -m1 'compileSdk = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          TARGET_SDK=$(grep -m1 'targetSdk = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [[ "$COMPILE_SDK" != "$ANDROID_API_LEVEL" || "$TARGET_SDK" != "$ANDROID_API_LEVEL" ]]; then
            echo "::error title=SDK version mismatch::Workflow ANDROID_API_LEVEL=$ANDROID_API_LEVEL but Gradle compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK"
            exit 1
          fi

      - name: Toolchain report
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version $GRADLE_FLAGS
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --list_installed | sed -n '1,120p'

      - name: Restore CI updater signing key
        id: signing_cache
        if: steps.guard.outputs.ready == 'true' && env.AURUM_RELEASE_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ${{ env.CI_SIGNING_CACHE_DIR }}
          key: aurum-ci-updater-signing-v1

      - name: Prepare updater signing key
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [[ -n "$AURUM_RELEASE_KEYSTORE_BASE64" ]]; then
            printf '%s' "$AURUM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurum-release-keystore"
            echo "AURUM_RELEASE_STORE_FILE=$RUNNER_TEMP/aurum-release-keystore" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_PASSWORD=$AURUM_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_ALIAS=$AURUM_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_PASSWORD=$AURUM_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_TYPE=${AURUM_RELEASE_STORE_TYPE:-}" >> "$GITHUB_ENV"
            echo "AURUM_SIGNING_MODE=repository secret" >> "$GITHUB_ENV"
          else
            mkdir -p "$CI_SIGNING_CACHE_DIR"
            STORE_FILE="$CI_SIGNING_CACHE_DIR/aurum-ci-updater.p12"
            if [[ ! -f "$STORE_FILE" ]]; then
              echo "::error title=Signing key unavailable::The updater key was not restored from the CI cache. Do not generate a replacement: previously installed APKs would reject it. Restore the SAME keystore via repository secrets."
              exit 1
            fi
            echo "AURUM_RELEASE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_ALIAS=aurumciupdater" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"
            echo "AURUM_SIGNING_MODE=GitHub Actions cache" >> "$GITHUB_ENV"
          fi

      - name: Resolve Android dependencies
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:dependencies --configuration debugRuntimeClasspath $GRADLE_FLAGS

      - name: Lint Android sources
        id: lint
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:lintDebug $GRADLE_FLAGS

      - name: Unit tests
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:testDebugUnitTest $GRADLE_FLAGS

      # A failed test should expose its assertion and source line in GitHub's annotations;
      # raw Actions logs/artifact downloads are not always accessible to contributors.
      - name: Annotate failing unit tests
        if: failure() && steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for report in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  cls = case.get('classname', '')
                  path = 'app/src/test/java/' + cls.replace('.', '/') + '.kt'
                  text = failure.text or ''
                  line_match = re.search(r'\(' + re.escape(cls.split('.')[-1]) + r'\.kt:(\d+)\)', text)
                  line = line_match.group(1) if line_match else '1'
                  message = (failure.get('message') or '') + '\n' + '\n'.join(text.splitlines()[:7])
                  escaped = message[:1300].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error file={path},line={line},title={cls}.{case.get("name", "test")}::{escaped}')
          PY

      - name: Build debug and release APKs
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:assembleDebug :${APP_MODULE}:assembleRelease $GRADLE_FLAGS

      # The in-app updater refuses an APK whose signing certificate differs from the installed one,
      # so a rotated/lost keystore must fail HERE — never publish an APK nobody can install over.
      - name: Verify signing continuity with the published release
        if: steps.guard.outputs.ready == 'true'
        id: signing_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          NEW_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          cert_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | awk -F': ' '/certificate SHA-256 digest/ { print tolower($2); exit }'
          }
          NEW_CERT="$(cert_of "$NEW_APK")"
          if [[ -z "$NEW_CERT" ]]; then
            echo "::error title=Unreadable signer::apksigner could not print the certificate of the built release APK"
            exit 1
          fi
          echo "Release APK signer SHA-256: $NEW_CERT (mode: ${AURUM_SIGNING_MODE:-unknown})"
          if [[ "$NEW_CERT" != "$UPDATER_CERT_SHA256" ]]; then
            echo "::error title=Unexpected updater signer::New APK signer differs from the user-selected #403 release certificate. Recover the SAME keystore; do not rotate it silently."
            exit 1
          fi
          echo "new_cert_sha256=$NEW_CERT" >> "$GITHUB_OUTPUT"
          FILTER='[.[] | select(.draft == false and .prerelease == false) | .assets[] | select((.name | startswith("'"$RELEASE_APK_PREFIX"'-v")) and (.name | endswith(".apk"))) | "\(.url) \(.name)"] | .[0] // empty'
          PUBLISHED="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq "$FILTER")"
          if [[ -z "${PUBLISHED// }" ]]; then
            echo "::error title=No signing anchor::No published release APK was found. Cannot prove that this APK can update the installed app."
            exit 1
          fi
          PREV_URL="${PUBLISHED%% *}"
          PREV_NAME="${PUBLISHED##* }"
          gh api --header "Accept: application/octet-stream" "$PREV_URL" > "$RUNNER_TEMP/published-release.apk"
          PREV_CERT="$(cert_of "$RUNNER_TEMP/published-release.apk")"
          echo "Published $PREV_NAME signer SHA-256: ${PREV_CERT:-unreadable}"
          echo "published_cert_sha256=$PREV_CERT" >> "$GITHUB_OUTPUT"
          if [[ -z "$PREV_CERT" ]]; then
            echo "::error title=Unreadable published signer::Could not read the certificate of $PREV_NAME, so signing continuity cannot be proven"
            exit 1
          fi
          if [[ "$PREV_CERT" != "$UPDATER_CERT_SHA256" ]]; then
            echo "::error title=Published signer mismatch::The public APK is not signed with the pinned updater certificate; stop rather than accept a rotated/replaced release."
            exit 1
          fi
          echo "::notice title=Updater signing certificate::New: $NEW_CERT; published $PREV_NAME: $PREV_CERT"
          if [[ "$NEW_CERT" != "$PREV_CERT" ]]; then
            echo "::error title=Signing key changed::The new APK is signed with $NEW_CERT but the published $PREV_NAME uses $PREV_CERT. In-app updates need the SAME key, so nothing is published. Restore the AURUM_RELEASE_* repository secrets or the aurum-ci-updater-signing-v1 cache from the default branch."
            exit 1
          fi
          AAPT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          apk_package() {
            "$AAPT" dump badging "$1" | sed -n -E "s/^package: name='([^']+)'.*/\1/p" | head -1
          }
          NEW_PACKAGE="$(apk_package "$NEW_APK")"
          PREV_PACKAGE="$(apk_package "$RUNNER_TEMP/published-release.apk")"
          if [[ "$NEW_PACKAGE" != "$APPLICATION_ID" || "$PREV_PACKAGE" != "$APPLICATION_ID" ]]; then
            echo "::error title=Incompatible package::New package $NEW_PACKAGE and published package $PREV_PACKAGE must both be $APPLICATION_ID"
            exit 1
          fi
          apk_code() {
            "$AAPT" dump badging "$1" | sed -n -E "s/^package: .*versionCode='([0-9]+)'.*/\1/p" | head -1
          }
          NEW_CODE="$(apk_code "$NEW_APK")"
          PREV_CODE="$(apk_code "$RUNNER_TEMP/published-release.apk")"
          if [[ -z "$NEW_CODE" || -z "$PREV_CODE" || "$NEW_CODE" -le "$PREV_CODE" ]]; then
            echo "::error title=Non-upgradable version::New versionCode $NEW_CODE must exceed the published $PREV_NAME versionCode $PREV_CODE"
            exit 1
          fi
          echo "::notice title=Updater version continuity::New versionCode $NEW_CODE > published $PREV_NAME versionCode $PREV_CODE"
          echo "continuity=verified: identical signer to $PREV_NAME; versionCode $NEW_CODE > $PREV_CODE" >> "$GITHUB_OUTPUT"

      - name: Collect APKs and updater metadata
        if: steps.guard.outputs.ready == 'true'
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION_NAME='${{ steps.version.outputs.name }}'
          VERSION_CODE='${{ steps.version.outputs.code }}'
          TAG='${{ steps.version.outputs.tag }}'
          APK_NAME='${{ steps.version.outputs.apk_name }}'
          RELEASE_APK="out/${APK_NAME}"
          DEBUG_APK="out/${RELEASE_APK_PREFIX}-debug-v${VERSION_NAME}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$RELEASE_APK"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_APK"
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DEBUG_SHA256=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$RELEASE_APK")
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "apk_name=$APK_NAME"
            echo "debug_apk_name=$(basename "$DEBUG_APK")"
            echo "apk_url=$APK_URL"
            echo "sha256=$SHA256"
            echo "debug_sha256=$DEBUG_SHA256"
            echo "size_bytes=$SIZE_BYTES"
          } >> "$GITHUB_OUTPUT"
          cat > "out/${APK_NAME}.json" <<JSON
          {
            "applicationId": "${APPLICATION_ID}",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tagName": "${TAG}",
            "commitSha": "${GITHUB_SHA}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifactName": "${APK_NAME}",
            "notes": "Aurum Edge Android APK built by the versioned GitHub Actions workflow. The in-app updater verifies package name, signing certificate, versionCode, size and SHA-256 before opening Android Installer.",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE_BYTES}
          }
          JSON
          cp "out/${APK_NAME}.json" out/aurum-edge.json
          {
            sha256sum "$RELEASE_APK"
            sha256sum "$DEBUG_APK"
            sha256sum "out/${APK_NAME}.json"
          } > out/checksums.sha256
          ls -la out

      - name: Upload APK artifacts
        if: steps.guard.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurum-edge-${{ steps.collect.outputs.version_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/*.apk
            out/*.json
            out/checksums.sha256

      - name: Upload test and lint reports
        if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurum-edge-reports-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**

      - name: Require stable signing for public updater release
        if: >-
          steps.guard.outputs.ready == 'true' &&
          (((github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
            (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))) ||
           (github.event_name == 'push' && github.ref == 'refs/heads/arena/20dbf868-ichimoko' &&
            startsWith(github.event.head_commit.message, 'release: publish approved v1.3.10 updater')))
        run: |
          set -euo pipefail
          # signing_check already verified the built AND published APK against the fixed #403
          # certificate, package ID and increasing versionCode. Never publish on skipped checks.
          if [[ -z "${AURUM_RELEASE_STORE_FILE:-}" || ! -f "${AURUM_RELEASE_STORE_FILE:-}" || -z "${AURUM_RELEASE_STORE_PASSWORD:-}" || -z "${AURUM_RELEASE_KEY_ALIAS:-}" || -z "${AURUM_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::error title=Stable signing required::No updater signing key was prepared."
            exit 1
          fi

      - name: Publish GitHub Release for in-app updater
        id: publish
        if: >-
          steps.guard.outputs.ready == 'true' &&
          (((github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
            (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))) ||
           (github.event_name == 'push' && github.ref == 'refs/heads/arena/20dbf868-ichimoko' &&
            startsWith(github.event.head_commit.message, 'release: publish approved v1.3.10 updater')))
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          VERSION_NAME: ${{ steps.collect.outputs.version_name }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.collect.outputs.size_bytes }}
        run: |
          set -euo pipefail
          NOTES=$'Aurum Edge Android APK.\n\nVersion: '"$VERSION_NAME"$'\nVersion code: ${{ steps.collect.outputs.version_code }}\nSHA-256: '"$SHA256"$'\nSize bytes: '"$SIZE_BYTES"$'\nSigning: '"${AURUM_SIGNING_MODE:-prepared updater key}"$'\n\nThe in-app updater accepts this public release asset, verifies package name, signing certificate, versionCode, size and SHA-256, then opens Android Installer.'
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$NOTES"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES"
          fi
          gh release upload "$TAG" "out/${APK_NAME}" "out/${APK_NAME}.json" "out/checksums.sha256" --clobber

      - name: Verify public updater release is discoverable
        if: steps.guard.outputs.ready == 'true' && steps.collect.outputs.tag != '' && (steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.collect.outputs.size_bytes }}
          VERSION_CODE: ${{ steps.collect.outputs.version_code }}
          VERSION_NAME: ${{ steps.collect.outputs.version_name }}
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          printf '%s' "$RELEASE" | jq -e --arg name "$APK_NAME" --arg digest "sha256:$SHA256" \
            --argjson bytes "$SIZE_BYTES" '
              (.draft == false) and (.prerelease == false) and
              any(.assets[]; .name == $name and .size == $bytes and .digest == $digest and
                .browser_download_url == ("https://github.com/" + env.GITHUB_REPOSITORY + "/releases/download/" + env.TAG + "/" + $name)) and
              any(.assets[]; .name == ($name + ".json"))' >/dev/null
          META_API_URL="$(printf '%s' "$RELEASE" | jq -r --arg name "$APK_NAME.json" '.assets[] | select(.name == $name) | .url')"
          META="$(gh api --header 'Accept: application/octet-stream' "$META_API_URL")"
          printf '%s' "$META" | jq -e --arg name "$APK_NAME" --arg sha "$SHA256" \
            --argjson code "$VERSION_CODE" --arg version "$VERSION_NAME" '
              .applicationId == "com.aurum.edge" and .artifactName == $name and
              .versionCode == $code and .sha256 == $sha and .versionName == $version' >/dev/null
          echo "::notice title=Public updater ready::$TAG code=$VERSION_CODE APK=$APK_NAME SHA-256=$SHA256 is listed in the public Release API with valid sidecar metadata."

      - name: Job summary
        if: always() && steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "## Aurum Edge — Android APK"
            echo ""
            echo "### Versions"
            echo "| Item | Version |"
            echo "|---|---:|"
            echo "| App versionName | ${{ steps.collect.outputs.version_name }} |"
            echo "| App versionCode | ${{ steps.collect.outputs.version_code }} |"
            echo "| Java | ${JAVA_DISTRIBUTION} ${JAVA_VERSION} |"
            echo "| Android API | ${ANDROID_API_LEVEL} |"
            echo "| Android build-tools | ${ANDROID_BUILD_TOOLS} |"
            echo ""
            echo "### Quality gates"
            echo "Lint report: ${{ steps.lint.outcome }}. Tests and APK assembly are required to pass."
            echo ""
            echo "### Artifacts"
            echo "| File | Purpose | SHA-256 |"
            echo "|---|---|---|"
            echo "| \`${{ steps.collect.outputs.apk_name }}\` | Release APK for install/update | \`${{ steps.collect.outputs.sha256 }}\` |"
            echo "| \`${{ steps.collect.outputs.debug_apk_name }}\` | Debug APK with separate applicationId | \`${{ steps.collect.outputs.debug_sha256 }}\` |"
            echo "| \`${{ steps.collect.outputs.apk_name }}.json\` | Updater sidecar metadata | — |"
            echo ""
            echo "Release signing: ${AURUM_SIGNING_MODE:-prepared updater key}."
            if [[ "${AURUM_SIGNING_MODE:-}" == "GitHub Actions cache" ]]; then
              echo "The first install from this channel establishes the updater signature; later workflow builds reuse the cached key."
            fi
            echo ""
            echo "### Signing continuity (in-app updates need the SAME key)"
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Signing key cache hit | `${{ steps.signing_cache.outputs.cache-hit }}` |"
            echo "| New release APK signer SHA-256 | `${{ steps.signing_check.outputs.new_cert_sha256 }}` |"
            echo "| Published release APK signer SHA-256 | `${{ steps.signing_check.outputs.published_cert_sha256 }}` |"
            echo "| Verdict | ${{ steps.signing_check.outputs.continuity }} |"
            echo ""
            echo "No market or AI API keys are embedded in the APK. Users enter optional keys only on their own device."
          } >> "$GITHUB_STEP_SUMMARY"
