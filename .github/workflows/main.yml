name: Android APK

# Versioned Android CI/CD pipeline for Aurum Edge.
# It installs every build prerequisite explicitly, validates the Gradle wrapper, runs lint/tests,
# builds debug + release APKs, creates updater metadata, and can publish a signed GitHub Release.
on:
  push:
    branches: [main, 'arena/**']
    tags: ['v*']
    paths:
      - 'android/**'
      - 'update/**'
      - 'tools/probe_crypto_venues.py'
      - 'tools/test_probe_crypto_venues.py'
      - '.github/workflows/main.yml'
  pull_request:
    paths:
      - 'android/**'
      - 'update/**'
      - 'tools/probe_crypto_venues.py'
      - 'tools/test_probe_crypto_venues.py'
      - '.github/workflows/main.yml'
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Optional app versionName for this run, for example 1.2.10. Blank = use android/app/build.gradle.kts.'
        required: false
        default: ''
        type: string
      version_code:
        description: 'Optional numeric versionCode for this run. Blank = use android/app/build.gradle.kts.'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish/refresh GitHub Release assets for the in-app updater. Requires stable signing secrets.'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

# All runner/tool versions are declared here so upgrades are intentional and visible.
env:
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: '17'
  ANDROID_API_LEVEL: '35'
  ANDROID_BUILD_TOOLS: '35.0.0'
  ANDROID_CMDLINE_TOOLS: latest
  PROJECT_DIR: android
  APP_MODULE: app
  APPLICATION_ID: com.aurum.edge
  RELEASE_APK_PREFIX: AurumEdge
  # Public signing certificate independently verified on immutable #403 and #405 release APKs.
  # This pins the user-selected #403 channel, not a certificate read from any phone.
  UPDATER_CERT_SHA256: '137f3f98f6c85fdd8671d1d2099b095ed82f3f91594ac9e7b1ba22c264ed4a04'
  GRADLE_FLAGS: --no-daemon --stacktrace --warning-mode=all

jobs:
  apk:
    name: Build, test, package APK
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      # Optional stable release signing secrets. In-app updates require the same signing key every time.
      AURUM_RELEASE_KEYSTORE_BASE64: ${{ secrets.AURUM_RELEASE_KEYSTORE_BASE64 }}
      AURUM_RELEASE_STORE_PASSWORD: ${{ secrets.AURUM_RELEASE_STORE_PASSWORD }}
      AURUM_RELEASE_KEY_ALIAS: ${{ secrets.AURUM_RELEASE_KEY_ALIAS }}
      AURUM_RELEASE_KEY_PASSWORD: ${{ secrets.AURUM_RELEASE_KEY_PASSWORD }}
      AURUM_RELEASE_STORE_TYPE: ${{ secrets.AURUM_RELEASE_STORE_TYPE }}
      CI_SIGNING_CACHE_DIR: /home/runner/.aurum-ci-signing
      # Shared predicate: only these runs can publish; PR and ordinary branch pushes are validation builds.
      PUBLIC_UPDATER_RELEASE: >-
        ${{ (((github.ref == 'refs/heads/main' || github.ref_type == 'tag') &&
          (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish_release == true))) ||
          (github.event_name == 'push' && github.ref == 'refs/heads/arena/20dbf868-ichimoko' &&
          (startsWith(github.event.head_commit.message, 'release: publish approved v1.3.14 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.15 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.16 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.17 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.18 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.19 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.20 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.21 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.22 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.23 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.24 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.25 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.26 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.27 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.28 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.29 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.30 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.31 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.32 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.33 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.34 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.35 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.36 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.42 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.43 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.44 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.45 updater') ||
          startsWith(github.event.head_commit.message, 'release: publish approved v1.3.46 updater')))) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard Android project
        id: guard
        run: |
          set -euo pipefail
          if [[ -d "$PROJECT_DIR" && -f "$PROJECT_DIR/gradlew" && -f "$PROJECT_DIR/app/build.gradle.kts" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            {
              echo "## Android APK — skipped"
              echo "The Android project was not found on this ref."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up JDK
        if: steps.guard.outputs.ready == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Install Android SDK packages
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          if [[ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          elif command -v sdkmanager >/dev/null 2>&1; then
            SDKMANAGER="$(command -v sdkmanager)"
          else
            echo "::error title=Android SDK missing::sdkmanager was not found on the runner"
            exit 1
          fi
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-${ANDROID_API_LEVEL}" \
            "build-tools;${ANDROID_BUILD_TOOLS}"

      - name: Validate Gradle wrapper
        if: steps.guard.outputs.ready == 'true'
        uses: gradle/actions/wrapper-validation@v4
        with:
          min-wrapper-count: 1

      - name: Set up Gradle cache
        if: steps.guard.outputs.ready == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Make Gradle wrapper executable
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: chmod +x ./gradlew

      - name: Resolve and validate app version
        if: steps.guard.outputs.ready == 'true'
        id: version
        env:
          INPUT_VERSION_NAME: ${{ github.event_name == 'workflow_dispatch' && inputs.version_name || '' }}
          INPUT_VERSION_CODE: ${{ github.event_name == 'workflow_dispatch' && inputs.version_code || '' }}
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          PROJECT_VERSION_NAME=$(grep -m1 'versionName = ' "$BUILD_FILE" | sed -E 's/.*"([^"]+)".*/\1/')
          PROJECT_VERSION_CODE=$(grep -m1 'versionCode = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          VERSION_NAME="${INPUT_VERSION_NAME:-$PROJECT_VERSION_NAME}"
          # A PR can be checked after the same commit has already been published.
          # Build the declared version, not an arbitrary Actions run number; only an
          # actual release must have a code greater than the latest public APK.
          VERSION_CODE="${INPUT_VERSION_CODE:-$PROJECT_VERSION_CODE}"
          if [[ ! "$VERSION_NAME" =~ ^[0-9]+(\.[0-9]+){1,3}([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error title=Invalid versionName::Use a semantic version such as 1.2.10"
            exit 1
          fi
          if [[ ! "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid versionCode::versionCode must be a positive integer"
            exit 1
          fi
          if [[ "$VERSION_NAME" != "$PROJECT_VERSION_NAME" ]]; then
            sed -i -E "0,/versionName[[:space:]]*=[[:space:]]*\"[^\"]+\"/s//versionName = \"${VERSION_NAME}\"/" "$BUILD_FILE"
          fi
          if [[ "$VERSION_CODE" != "$PROJECT_VERSION_CODE" ]]; then
            sed -i -E "0,/versionCode[[:space:]]*=[[:space:]]*[0-9]+/s//versionCode = ${VERSION_CODE}/" "$BUILD_FILE"
          fi
          {
            echo "name=$VERSION_NAME"
            echo "code=$VERSION_CODE"
            echo "tag=v$VERSION_NAME"
            echo "apk_name=${RELEASE_APK_PREFIX}-v${VERSION_NAME}.apk"
          } >> "$GITHUB_OUTPUT"

      - name: Verify project SDK configuration
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"
          COMPILE_SDK=$(grep -m1 'compileSdk = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          TARGET_SDK=$(grep -m1 'targetSdk = ' "$BUILD_FILE" | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          if [[ "$COMPILE_SDK" != "$ANDROID_API_LEVEL" || "$TARGET_SDK" != "$ANDROID_API_LEVEL" ]]; then
            echo "::error title=SDK version mismatch::Workflow ANDROID_API_LEVEL=$ANDROID_API_LEVEL but Gradle compileSdk=$COMPILE_SDK targetSdk=$TARGET_SDK"
            exit 1
          fi

      - name: Toolchain report
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          java -version
          ./gradlew --version $GRADLE_FLAGS
          echo "ANDROID_HOME=${ANDROID_HOME}"
          SDKMANAGER="${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager)"; fi
          "$SDKMANAGER" --list_installed | sed -n '1,120p'

      - name: Restore CI updater signing key
        id: signing_cache
        if: steps.guard.outputs.ready == 'true' && env.AURUM_RELEASE_KEYSTORE_BASE64 == ''
        uses: actions/cache@v4
        with:
          path: ${{ env.CI_SIGNING_CACHE_DIR }}
          key: aurum-ci-updater-signing-v1

      - name: Prepare updater signing key
        if: steps.guard.outputs.ready == 'true'
        run: |
          set -euo pipefail
          if [[ -n "$AURUM_RELEASE_KEYSTORE_BASE64" ]]; then
            printf '%s' "$AURUM_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/aurum-release-keystore"
            echo "AURUM_RELEASE_STORE_FILE=$RUNNER_TEMP/aurum-release-keystore" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_PASSWORD=$AURUM_RELEASE_STORE_PASSWORD" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_ALIAS=$AURUM_RELEASE_KEY_ALIAS" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_PASSWORD=$AURUM_RELEASE_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_TYPE=${AURUM_RELEASE_STORE_TYPE:-}" >> "$GITHUB_ENV"
            echo "AURUM_SIGNING_MODE=repository secret" >> "$GITHUB_ENV"
          else
            mkdir -p "$CI_SIGNING_CACHE_DIR"
            STORE_FILE="$CI_SIGNING_CACHE_DIR/aurum-ci-updater.p12"
            if [[ ! -f "$STORE_FILE" ]]; then
              echo "::error title=Signing key unavailable::The updater key was not restored from the CI cache. Do not generate a replacement: previously installed APKs would reject it. Restore the SAME keystore via repository secrets."
              exit 1
            fi
            echo "AURUM_RELEASE_STORE_FILE=$STORE_FILE" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_PASSWORD=android" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_ALIAS=aurumciupdater" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_KEY_PASSWORD=android" >> "$GITHUB_ENV"
            echo "AURUM_RELEASE_STORE_TYPE=pkcs12" >> "$GITHUB_ENV"
            echo "AURUM_SIGNING_MODE=GitHub Actions cache" >> "$GITHUB_ENV"
          fi

      - name: Resolve Android dependencies
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:dependencies --configuration debugRuntimeClasspath $GRADLE_FLAGS

      - name: Test durable tick archive
        run: |
          python3 -m venv tick-archive/.venv
          tick-archive/.venv/bin/pip install -r tick-archive/requirements.txt
          (cd tick-archive && .venv/bin/python -m unittest discover -s tests -v)

      - name: Lint Android sources
        id: lint
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:lintDebug $GRADLE_FLAGS

      - name: Unit tests
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:testDebugUnitTest $GRADLE_FLAGS

      # A failed test should expose its assertion and source line in GitHub's annotations;
      # raw Actions logs/artifact downloads are not always accessible to contributors.
      - name: Annotate failing unit tests
        if: failure() && steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import xml.etree.ElementTree as ET
          for report in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml'):
              root = ET.parse(report).getroot()
              for case in root.iter('testcase'):
                  failure = case.find('failure')
                  if failure is None:
                      failure = case.find('error')
                  if failure is None:
                      continue
                  cls = case.get('classname', '')
                  path = 'app/src/test/java/' + cls.replace('.', '/') + '.kt'
                  text = failure.text or ''
                  line_match = re.search(r'\(' + re.escape(cls.split('.')[-1]) + r'\.kt:(\d+)\)', text)
                  line = line_match.group(1) if line_match else '1'
                  message = (failure.get('message') or '') + '\n' + '\n'.join(text.splitlines()[:7])
                  escaped = message[:1300].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
                  print(f'::error file={path},line={line},title={cls}.{case.get("name", "test")}::{escaped}')
          PY

      - name: Build debug and release APKs
        if: steps.guard.outputs.ready == 'true'
        working-directory: ${{ env.PROJECT_DIR }}
        run: ./gradlew :${APP_MODULE}:assembleDebug :${APP_MODULE}:assembleRelease $GRADLE_FLAGS

      # The in-app updater refuses an APK whose signing certificate differs from the installed one,
      # so a rotated/lost keystore must fail HERE — never publish an APK nobody can install over.
      - name: Verify signing continuity with the published release
        if: steps.guard.outputs.ready == 'true'
        id: signing_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          APKSIGNER="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          NEW_APK="$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk"
          cert_of() {
            "$APKSIGNER" verify --print-certs "$1" \
              | awk -F': ' '/certificate SHA-256 digest/ { print tolower($2); exit }'
          }
          [[ "$(tr -d '\n\r ' < update/updater-signer.sha256)" == "$UPDATER_CERT_SHA256" ]] || {
            echo "::error title=Updater signer pin mismatch::On-device fingerprint differs from CI release pin."
            exit 1
          }
          NEW_CERT="$(cert_of "$NEW_APK")"
          if [[ -z "$NEW_CERT" ]]; then
            echo "::error title=Unreadable signer::apksigner could not print the certificate of the built release APK"
            exit 1
          fi
          echo "Release APK signer SHA-256: $NEW_CERT (mode: ${AURUM_SIGNING_MODE:-unknown})"
          if [[ "$NEW_CERT" != "$UPDATER_CERT_SHA256" ]]; then
            echo "::error title=Unexpected updater signer::New APK signer differs from the user-selected #403 release certificate. Recover the SAME keystore; do not rotate it silently."
            exit 1
          fi
          echo "new_cert_sha256=$NEW_CERT" >> "$GITHUB_OUTPUT"
          FILTER='[.[] | select(.draft == false and .prerelease == false) | .assets[] | select((.name | startswith("'"$RELEASE_APK_PREFIX"'-v")) and (.name | endswith(".apk"))) | "\(.url) \(.name)"] | .[0] // empty'
          PUBLISHED="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=10" --jq "$FILTER")"
          if [[ -z "${PUBLISHED// }" ]]; then
            echo "::error title=No signing anchor::No published release APK was found. Cannot prove that this APK can update the installed app."
            exit 1
          fi
          PREV_URL="${PUBLISHED%% *}"
          PREV_NAME="${PUBLISHED##* }"
          gh api --header "Accept: application/octet-stream" "$PREV_URL" > "$RUNNER_TEMP/published-release.apk"
          PREV_CERT="$(cert_of "$RUNNER_TEMP/published-release.apk")"
          echo "Published $PREV_NAME signer SHA-256: ${PREV_CERT:-unreadable}"
          echo "published_cert_sha256=$PREV_CERT" >> "$GITHUB_OUTPUT"
          if [[ -z "$PREV_CERT" ]]; then
            echo "::error title=Unreadable published signer::Could not read the certificate of $PREV_NAME, so signing continuity cannot be proven"
            exit 1
          fi
          if [[ "$PREV_CERT" != "$UPDATER_CERT_SHA256" ]]; then
            echo "::error title=Published signer mismatch::The public APK is not signed with the pinned updater certificate; stop rather than accept a rotated/replaced release."
            exit 1
          fi
          echo "::notice title=Updater signing certificate::New: $NEW_CERT; published $PREV_NAME: $PREV_CERT"
          if [[ "$NEW_CERT" != "$PREV_CERT" ]]; then
            echo "::error title=Signing key changed::The new APK is signed with $NEW_CERT but the published $PREV_NAME uses $PREV_CERT. In-app updates need the SAME key, so nothing is published. Restore the AURUM_RELEASE_* repository secrets or the aurum-ci-updater-signing-v1 cache from the default branch."
            exit 1
          fi
          AAPT="$SDK/build-tools/${ANDROID_BUILD_TOOLS}/aapt"
          apk_package() {
            "$AAPT" dump badging "$1" | sed -n -E "s/^package: name='([^']+)'.*/\1/p" | head -1
          }
          NEW_PACKAGE="$(apk_package "$NEW_APK")"
          PREV_PACKAGE="$(apk_package "$RUNNER_TEMP/published-release.apk")"
          if [[ "$NEW_PACKAGE" != "$APPLICATION_ID" || "$PREV_PACKAGE" != "$APPLICATION_ID" ]]; then
            echo "::error title=Incompatible package::New package $NEW_PACKAGE and published package $PREV_PACKAGE must both be $APPLICATION_ID"
            exit 1
          fi
          apk_code() {
            "$AAPT" dump badging "$1" | sed -n -E "s/^package: .*versionCode='([0-9]+)'.*/\1/p" | head -1
          }
          NEW_CODE="$(apk_code "$NEW_APK")"
          PREV_CODE="$(apk_code "$RUNNER_TEMP/published-release.apk")"
          if [[ -z "$NEW_CODE" || -z "$PREV_CODE" ]]; then
            echo "::error title=Unreadable version::Cannot compare APK version codes"
            exit 1
          fi
          if [[ "$PUBLIC_UPDATER_RELEASE" != "true" ]]; then
            # PR and ordinary branch checks do not publish. They may run after the
            # same commit has already shipped; equality is not a broken update.
            echo "::notice title=Validation-build compatibility::Signers and package IDs match. versionCode $NEW_CODE is not tested for upgrade over $PREV_CODE because this build is not published."
            echo "continuity=validation-only: identical signer to $PREV_NAME; release versionCode gate not applicable" >> "$GITHUB_OUTPUT"
          else
            if [[ "$NEW_CODE" -le "$PREV_CODE" ]]; then
              echo "::error title=Non-upgradable version::New versionCode $NEW_CODE must exceed the published $PREV_NAME versionCode $PREV_CODE"
              exit 1
            fi
            echo "::notice title=Updater version continuity::New versionCode $NEW_CODE > published $PREV_NAME versionCode $PREV_CODE"
            echo "continuity=verified: identical signer to $PREV_NAME; versionCode $NEW_CODE > $PREV_CODE" >> "$GITHUB_OUTPUT"
          fi

      - name: Collect APKs and updater metadata
        if: steps.guard.outputs.ready == 'true'
        id: collect
        run: |
          set -euo pipefail
          mkdir -p out
          VERSION_NAME='${{ steps.version.outputs.name }}'
          VERSION_CODE='${{ steps.version.outputs.code }}'
          TAG='${{ steps.version.outputs.tag }}'
          APK_NAME='${{ steps.version.outputs.apk_name }}'
          RELEASE_APK="out/${APK_NAME}"
          DEBUG_APK="out/${RELEASE_APK_PREFIX}-debug-v${VERSION_NAME}.apk"
          cp "$PROJECT_DIR/app/build/outputs/apk/release/app-release.apk" "$RELEASE_APK"
          cp "$PROJECT_DIR/app/build/outputs/apk/debug/app-debug.apk" "$DEBUG_APK"
          SHA256=$(sha256sum "$RELEASE_APK" | awk '{print $1}')
          DEBUG_SHA256=$(sha256sum "$DEBUG_APK" | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s "$RELEASE_APK")
          APK_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${APK_NAME}"
          {
            echo "version_name=$VERSION_NAME"
            echo "version_code=$VERSION_CODE"
            echo "tag=$TAG"
            echo "apk_name=$APK_NAME"
            echo "debug_apk_name=$(basename "$DEBUG_APK")"
            echo "apk_url=$APK_URL"
            echo "sha256=$SHA256"
            echo "debug_sha256=$DEBUG_SHA256"
            echo "size_bytes=$SIZE_BYTES"
          } >> "$GITHUB_OUTPUT"
          cat > "out/${APK_NAME}.json" <<JSON
          {
            "applicationId": "${APPLICATION_ID}",
            "versionCode": ${VERSION_CODE},
            "versionName": "${VERSION_NAME}",
            "tagName": "${TAG}",
            "commitSha": "${GITHUB_SHA}",
            "publishedAt": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "artifactName": "${APK_NAME}",
            "notes": "Aurum Edge Android APK built by the versioned GitHub Actions workflow. The in-app updater verifies package name, signing certificate, versionCode, size and SHA-256 before opening Android Installer.",
            "apkUrl": "${APK_URL}",
            "sha256": "${SHA256}",
            "sizeBytes": ${SIZE_BYTES}
          }
          JSON
          cp "out/${APK_NAME}.json" out/aurum-edge.json
          {
            sha256sum "$RELEASE_APK"
            sha256sum "$DEBUG_APK"
            sha256sum "out/${APK_NAME}.json"
          } > out/checksums.sha256
          ls -la out

      - name: Upload APK artifacts
        if: steps.guard.outputs.ready == 'true' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: aurum-edge-${{ steps.collect.outputs.version_name }}-${{ github.run_number }}
          if-no-files-found: error
          retention-days: 30
          path: |
            out/*.apk
            out/*.json
            out/checksums.sha256

      - name: Upload test and lint reports
        if: always() && steps.guard.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: aurum-edge-reports-${{ github.run_number }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            android/app/build/reports/lint-results-debug.html
            android/app/build/reports/tests/testDebugUnitTest/**
            android/app/build/test-results/testDebugUnitTest/**

      - name: Require stable signing for public updater release
        if: steps.guard.outputs.ready == 'true' && env.PUBLIC_UPDATER_RELEASE == 'true'
        run: |
          set -euo pipefail
          # signing_check already verified the built AND published APK against the fixed #403
          # certificate, package ID and increasing versionCode. Never publish on skipped checks.
          if [[ -z "${AURUM_RELEASE_STORE_FILE:-}" || ! -f "${AURUM_RELEASE_STORE_FILE:-}" || -z "${AURUM_RELEASE_STORE_PASSWORD:-}" || -z "${AURUM_RELEASE_KEY_ALIAS:-}" || -z "${AURUM_RELEASE_KEY_PASSWORD:-}" ]]; then
            echo "::error title=Stable signing required::No updater signing key was prepared."
            exit 1
          fi

      - name: Publish GitHub Release for in-app updater
        id: publish
        if: steps.guard.outputs.ready == 'true' && env.PUBLIC_UPDATER_RELEASE == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          VERSION_NAME: ${{ steps.collect.outputs.version_name }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.collect.outputs.size_bytes }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == "refs/heads/arena/20dbf868-ichimoko" &&
                ( "$VERSION_NAME" != "1.3.46" || "$TAG" != "v1.3.46" || "${{ steps.collect.outputs.version_code }}" != "662" ) ]]; then
            echo "::error title=Wrong release version::Explicit 1.3.46 authorization cannot publish another version."
            exit 1
          fi
          NOTES=$'Aurum Edge Android APK.\n\nVersion: '"$VERSION_NAME"$'\nVersion code: ${{ steps.collect.outputs.version_code }}\nSHA-256: '"$SHA256"$'\nSize bytes: '"$SIZE_BYTES"$'\nSigning: '"${AURUM_SIGNING_MODE:-prepared updater key}"$'\n\nThe in-app updater accepts this public release asset, verifies package name, signing certificate, versionCode, size and SHA-256, then opens Android Installer.'
          if [[ "$VERSION_NAME" == "1.3.14" ]]; then
            NOTES+=$'\n\nChanges: automatic paper-entry evaluation across the supported catalog, not just the selected chart. Only symbols with fresh independently timestamped, same-identity trade ticks AND continuous exit monitoring can open automatically (currently FX pairs and XAU/XAG on the spot fallback). Other catalog markets continue automatic read-only scans with explicit reasons. Requires the existing user opt-in; no broker orders.'
          fi
          if [[ "$VERSION_NAME" == "1.3.22" ]]; then
            NOTES+=$'\n\nChanges: removed the selected-symbol news gate card completely (the engine news gate remains). The chart tab now uses a single TradingView iframe in a WebView based on the chart-loading code from CI run #350 rather than the 1.3.21 async embed script. HTTPS/TLS safeguards remain enabled. CI cannot confirm candles render on a particular phone or network; please test the chart on the device and report its result.'
          fi
          if [[ "$VERSION_NAME" == "1.3.23" ]]; then
            NOTES+=$'\n\nChanges: paper auto-entry can consider Nobitex USDT pairs only when all seven closed-bar intervals, an independent exchange-timestamped executed trade, V1 risk limits and monitored exits are available. The scanner previously blocked ALL catalog crypto entries. Stocks/oil remain read-only without same-identity monitored ticks; the oil entry quarantine is unchanged. No execution frequency or phone feed availability is guaranteed.'
          fi
          if [[ "$VERSION_NAME" == "1.3.24" ]]; then
            NOTES+=$'\n\nChanges: a compact searchable symbol picker above the single TradingView iframe lets users select mapped FX, crypto, commodities and equities directly on the chart tab. The chosen chart ticker persists on navigation and is not reset to gold when the app settings/feed changes. This visual choice does not change trading signals or paper positions. Actual widget/network rendering still needs device verification.'
          fi
          if [[ "$VERSION_NAME" == "1.3.25" ]]; then
            NOTES+=$'\n\nChanges: the Trading tab now separates AI connectivity, a fresh same-symbol advisory response, validated news evidence/veto, and the recorded effect of the automatic paper-entry AI review. Each attempted entry review is persisted by symbol, model, bar and outcome in the Decision Log (explicit veto, non-veto, missing verdict, invalid response or unavailable). Only an explicit negative verdict with a valid reason vetoes. The model never creates a signal, overrides technical price/risk levels or proves better returns. No claim of on-device network availability is made.'
          fi
          if [[ "$VERSION_NAME" == "1.3.26" ]]; then
            NOTES+=$'\n\nChanges: within the existing four-layer V1 engine, crypto M5/M15 in hybrid/trend mode can count an independently validated Ichimoku compression-to-release as structural confirmation. Compression of Tenkan/Kijun and the projected cloud over prior closed bars alone is NOT a direction or an entry: Chikou must clear historical price AND the cloud at its own plotted time, while a closed 20-bar breakout, matching line/cloud geometry and real volume confirm the move. Seven independent 320-closed-bar intervals, the current threshold, absolute volatility veto, same-venue fresh trade tick, cost/risk and paper journal rules remain in force. This is a testable entry hypothesis, not a demonstrated improvement in win rate or profit; Binance TradingView charts are not Nobitex execution evidence.'
          fi
          if [[ "$VERSION_NAME" == "1.3.27" ]]; then
            NOTES+=$'\n\nChanges: the single TradingView chart iframe now requests 5-minute candles whenever the chart or symbol loads, instead of the former 60-minute default. Selecting the currently displayed symbol again reloads the same widget at 5 minutes. This is visual-only: the app signal timeframe, feed and trades do not change. TradingView may still allow a manual timeframe change inside its own third-party iframe until the next reload; this app cannot claim to enforce an in-iframe lock or verify device rendering without a phone test.'
          fi
          if [[ "$VERSION_NAME" == "1.3.28" ]]; then
            NOTES+=$'\n\nChanges: crypto paper-entry scanner now compares independently evaluated closed M3/M5/M15 candidates using the same seven-frame V1 engine, picks the highest-confidence actionable timeframe, and persists the actual timeframe in the trade journal. M3 is assembled only from three complete, contiguous same-pair Nobitex M1 candles per bucket, with 320 consecutive M3 bars required; missing minute data fails closed. A separate fresh Nobitex executed-trade quote remains mandatory for paper entry. The selected crypto symbol participates in the same comparison. The 5-minute TradingView chart display stays unchanged. No new cross-exchange tick feed was connected: Binance aggregate trades are limited/paginated, may be geo-blocked, and must not be silently mixed with Nobitex quotes. Missing data, AI veto and risk guards still block entries; no live trading or profitability claim. Live device/provider coverage has not been verified.'
          fi
          if [[ "$VERSION_NAME" == "1.3.29" ]]; then
            NOTES+=$'\n\nChanges: open crypto PAPER positions now reconcile each executed trade returned in overlapping Nobitex recent-trade pages in time order, instead of settling from only the last snapshot. A missing page overlap, ambiguous duplicate, missing history since entry or prolonged feed failure records a persistent coverage-gap warning in the open trade journal. The endpoint publishes no global trade IDs or guaranteed historical pagination, so missing ticks cannot be recovered or zero-loss coverage promised, especially across mobile offline/OS service stops. FX and commodity feeds remain sampled quotes. Automatic market scanning already runs while the app is visible and via the explicitly enabled Android foreground monitor; it cannot run without permission or past Android time limits. The single 5m TradingView widget requests built-in Ichimoku on each load and passes study override values derived from the V1 engine (8/24/72, shift 24); cross-origin rendering and manual removal cannot be verified or locked without on-device checks. No broker orders or profitability claims.'
          fi
          if [[ "$VERSION_NAME" == "1.3.30" ]]; then
            NOTES+=$'\n\nChanges: foreground monitoring uses independent coroutine tasks for market scanning, news/calendar, AI, selected-market feed, journal notifications and one supervised task per open-position symbol. A stalled quote for one pair no longer holds another pair under a process-wide quote/tick mutex. Position workers start/stop with the position, keep same-pair 10-second public-feed limits and may only settle/flag the exact paper position they started for. The journal still serializes atomic writes; provider and Android limits still apply. This is bounded task-level concurrency within one Android process, NOT extra independent trading engines or a guarantee of no lost ticks, unlimited scans, device operation or profit.'
          fi
          if [[ "$VERSION_NAME" == "1.3.31" ]]; then
            NOTES+=$'\n\nChanges: OPEN crypto paper positions have first priority for Nobitex public-trade updates. Their per-symbol worker requests the next trade page after a minimum 3-second interval (actual latency can be higher), with up to 40 reserved attempts in a conservative global 55-per-rolling-minute budget; display quotes and new-entry checks cannot consume more than 15. Both lanes retain same-symbol caching/locks and missing overlap still flags a coverage gap in the journal, never inventing ticks. The scanner rechecks current open positions before each symbol to avoid avoidable lower-priority work. The publisher limit, 2-open-crypto-slot policy and Android background restrictions still apply. REST polling cannot guarantee moment-by-moment or gapless delivery, device operation or profits; no broker orders are submitted.'
          fi
          if [[ "$VERSION_NAME" == "1.3.32" ]]; then
            NOTES+=$'\n\nChanges: the documented Nobitex public:trades-{marketSymbol} WebSocket now drives ordered live paper-position exits on the same venue, using the official Centrifugo Android SDK for ping/pong, reconnect and recovery only when the server advertises it and retains the history. REST same-venue pages remain bootstrap and disconnected fallback under the existing reserved rate budget. Unrecoverable reconnection, REST/socket handoff without common IDs, stale/invalid events, missing publication offsets (where supported), or queue overload mark a persistent journal coverage gap; no missed trade or stop touch is invented. Per-position workers remain isolated from scanner, AI and news; crypto entry requires Nobitex history and Nobitex live trades, and manual close rejects cross-venue selected-market prices. The journal shows stream/reconnect/REST status. Android/network interruptions, server retention and mobile background limits still prevent a guarantee of every tick; on-device provider coverage has not been verified. No broker orders or profitability claims.'
          fi
          if [[ "$VERSION_NAME" == "1.3.33" ]]; then
            NOTES+=$'\n\nChanges: TradingView stays a single DISPLAY-ONLY chart iframe; official widget FAQ offers no raw tick export/data API and the platform prohibits non-display algorithmic/risk use. The undocumented TradingView scanner was removed as an in-app quote source. Crypto watch rows now fetch timestamped Nobitex USDT executions through the existing shared, position-reserved rate budget, capped at one watch refresh/minute; previously selected scanner-only preferences migrate to the same-venue source. Gold/FX watch rows no longer count a TradingView scanner quote as independent confirmation. Nobitex WebSocket position tracking now distinguishes server-advertised recovery in the journal and uses the publisher offset, rather than exchange milliseconds, for ordered recoverable publications. REST/stream handoff or failed recovery still audits unknown coverage; Android/device/network limits remain. The seven-timeframe V1 engine, risk guards, independent workers and single 5m TradingView widget are unchanged. No broker orders, guarantees of every tick, on-device stream validation or profitability claims.'
          fi
          if [[ "$VERSION_NAME" == "1.3.34" ]]; then
            NOTES+=$'\n\nChanges: optional self-hosted Nobitex public-trade archive for NEW crypto paper positions. A deployable single-instance Python/Centrifugo/SQLite service stores same-venue public executions with a durable local sequence, authenticated paged replay and explicit publisher/restart/offset-gap records. The Android app accepts a user-owned HTTPS archive URL and read token; it downloads historical pages after reconnect and atomically checkpoints each paper settlement/trailing update. No positions or trading secrets are sent to the server. TradingView remains display-only and other market venues are not mixed into crypto exits. This APK alone does NOT provide 24/7 coverage: the owner must deploy and monitor the always-on host. With the phone off, server ingestion can continue but journal exits and alerts occur only after device reconnection. Upstream omissions, exchange recovery, disk capacity, server uptime and on-device availability are not guaranteed; no broker orders or profitability claims.'
          fi
          if [[ "$VERSION_NAME" == "1.3.35" ]]; then
            NOTES+=$'\n\nChanges: open paper-trade tracking no longer substitutes entry price when the latest independently timestamped quote is missing or older than 45 seconds. The home card, market banners, equity/free margin and journal show unknown values until a valid tick arrives, using an atomic price/timestamp snapshot. The journal chart starts with the latest 320 real candles; an offscreen entry marker is distinguished from missing history, and tab state is preserved on navigation. Manual paper exits also revalidate quote age at closing time and reject stale fills. This is a UI/valuation correction and stale-price safeguard, not evidence that every real tick is captured. The embedded TradingView widget can reload when its tab is recreated; chart appearance and position settlement are separate. Device behavior and uninterrupted provider coverage have not been verified.'
          fi
          if [[ "$VERSION_NAME" == "1.3.44" ]]; then
            NOTES+=$'\n\nChanges: every NEW manual or automatic paper position now requires a verified closed 5-minute (5m) entry signal. The catalog scanner evaluates only a 5m base for all asset classes, including crypto; a higher-scored 15m setup can no longer replace a 5m entry. M15 and H1 remain independent trend-alignment inputs, not trade entry timeframes. The signal engine and auto-entry policy reject non-5m bases, and the authoritative journal rejects even a forged non-5m signal. Other chart intervals remain view-only for entries; existing trades keep their recorded timeframe and exits remain manageable. Independent same-venue ticks, setup, news and risk checks are unchanged. No guarantee of trading frequency or provider availability.'
          fi
          if [[ "$VERSION_NAME" == "1.3.43" ]]; then
            NOTES+=$'\n\nChanges: all NEW paper positions now require a directional Tenkan/Kijun cross on one of the latest two independently closed base bars, with at least three of five preceding bars compressed and a thin visible cloud at cross and evaluation time. The journal rejects signals without matching entry evidence; existing session, same-venue trade-tick, timeframe, news and risk rules still apply. The Home/Trading position display retains each trade\x27s last verified price, P/L and movement silently through a missing tick (at least 10 seconds and until another verified tick), showing the original absolute publisher time; these display snapshots never authorize risk, fills or settlement. Category cards now distinguish no open position from a closed session, unsupported monitored quote, waiting scan and missing setup. No guarantee of profit, provider uptime or phone-off operation; device behavior is unverified.'
          fi
          if [[ "$VERSION_NAME" == "1.3.42" ]]; then
            NOTES+=$'\n\nChanges: while tracking an open paper position, the Home card and market banner retain the last verified P/L and gauge position when a quote becomes unavailable. The retained value is explicitly marked frozen, displays the original trade-tick time/age, and is UI-only for the current app process. No previous mark is reused for a different trade or placed back into liveTicks, settlement, risk or live account equity. If the app process restarts before another verified tick, no frozen mark is available.'
          fi
          if [[ "$VERSION_NAME" == "1.3.41" ]]; then
            NOTES+=$'\n\nChanges: each open-position symbol now updates its on-screen quote and P/L independently: a slow or failed provider cannot block or clear the other symbol displays. Stale/failed ticks are removed only for their own symbol, no synthetic fills. The radar timer is independent of optional news/AI requests. The foreground service still owns per-position same-venue exit monitoring; Android/provider/network limits remain. Includes the v1.3.40 bounded category scanner lanes, per-source watch progress, and responsive Home cards.'
          fi
          if [[ "$VERSION_NAME" == "1.3.40" ]]; then
            NOTES+=$'\n\nChanges: bounded independent category scanner lanes (crypto two, FX/commodity/stock one each), per-symbol results and real primary candle source/time shown as soon as that symbol completes; source-group watch quotes publish without waiting for slow groups. Home with no open positions shows actual radar progress instead of empty position cards; active gauge and account tiles fit narrow screens. No fake ticks, no changed same-venue execution rule, no promise of second-by-second closed-bar scans or uninterrupted free feeds. Kraken/OKX/Gate are still read-only audit candidates, not authorized execution venues.'
          fi
          if [[ "$VERSION_NAME" == "1.3.39" ]]; then
            NOTES+=$'\n\nChanges: restores in-app updates by publishing a real public release (not a private Actions artifact); displays the on-device certificate fingerprint next to the pinned release-channel certificate. The updater refuses mismatched signatures; never uninstall before preserving private local data. Paper testing no longer pauses entry solely after three consecutive losses; other risk limits remain. Phone-specific signature/install behavior needs device verification.'
          fi
          if [[ "$VERSION_NAME" == "1.3.36" ]]; then
            NOTES+=$'\n\nChanges: NEW crypto paper positions now use the same Binance Spot USDT venue for seven independent 320-closed-bar history windows, fresh independently timestamped aggregate-trade entry, and ID-ordered open-position WebSocket monitoring. Public market-data-only REST fromId replays gaps/reconnects and checkpoints the last processed aggregate ID with trailing/exit in the journal. BTC selected-chart heavy analysis is throttled to once per second while open-position ticks keep an independent higher-priority worker. Old Nobitex positions remain on their original venue and are never silently repriced with Binance. The watchlist uses Binance market-only quotes; old preferences migrate. aggTrade aggregates fills per taker order/price: it is NOT a raw record of every individual fill. WebSocket is event-driven, not a guarantee that the market prints a trade each second. If Binance Vision is blocked/returns 451, no Binance paper entry occurs; no cross-venue fallback is used. Android offline/background/network/rate limits mean no guaranteed tick coverage or phone-off execution. TradingView remains display-only. On-device stream reachability must still be checked.'
          fi
          if [[ "$VERSION_NAME" == "1.3.45" ]]; then
            NOTES+=$'\n\nChanges: updates the read-only 81-symbol radar with per-symbol same-identity source fallbacks (crypto Gate Spot, OKX Spot, Kraken Spot where listed; FX Yahoo then Dukascopy then optional Twelve Data). Failed providers do not silently stitch candles or authorize fills on another venue. A fresh read-only crypto trade can be shown when a full candle bundle is unavailable, but cannot open or settle a position. Removes the artificial one-second gap between scanner starts while retaining bounded publisher lanes; measured full-sweep duration is displayed, with no sub-second fresh-data guarantee. Adds Google AI Studio key instructions and an OpenAI-compatible Gemini AI preset for optional commentary; Gemini is not a market-price feed. Model/key/region/quota and Android on-device behavior must be tested by the user. No broker orders or guarantees of uninterrupted free data.'
          fi
          if [[ "$VERSION_NAME" == "1.3.46" ]]; then
            NOTES+=$'\n\nChanges: fixes the Gemini OpenAI-compatible model ID 404 caused by entering a native Gemini ID such as models/gemini-2.5-pro. Only for the exact official Google OpenAI-compatible HTTPS endpoint, remove the native models/ prefix in outgoing requests and normalize saved model names and the displayed model list. Existing on-device model settings work without re-entering the key; other providers are unchanged. Adds an in-app hint to pick a model actually available to the user\x27s key; Gemini 2.5 Pro may still be unavailable to new projects. A real successful device-side connectivity test and saving the draft are still required; no secret is sent to chat or embedded in the APK.'
          fi
          # Fail closed on a pre-existing tag: editing or clobbering a published release can
          # silently replace an APK already downloaded by users, without versionCode changing.
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1 ||
             gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error title=Existing release tag::Refusing to overwrite $TAG; bump version and code."
            exit 1
          fi
          gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$NOTES" --draft
          gh release upload "$TAG" "out/${APK_NAME}" "out/${APK_NAME}.json" "out/checksums.sha256"
          # A draft is invisible to the updater; publish only once all assets are uploaded.
          gh release edit "$TAG" --draft=false

      - name: Verify public updater release is discoverable
        if: steps.guard.outputs.ready == 'true' && steps.collect.outputs.tag != '' && (steps.publish.outcome == 'success')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.collect.outputs.tag }}
          APK_NAME: ${{ steps.collect.outputs.apk_name }}
          SHA256: ${{ steps.collect.outputs.sha256 }}
          SIZE_BYTES: ${{ steps.collect.outputs.size_bytes }}
          VERSION_CODE: ${{ steps.collect.outputs.version_code }}
          VERSION_NAME: ${{ steps.collect.outputs.version_name }}
        run: |
          set -euo pipefail
          RELEASE="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG")"
          printf '%s' "$RELEASE" | jq -e --arg name "$APK_NAME" --arg digest "sha256:$SHA256" \
            --argjson bytes "$SIZE_BYTES" '
              (.draft == false) and (.prerelease == false) and
              any(.assets[]; .name == $name and .size == $bytes and .digest == $digest and
                .browser_download_url == ("https://github.com/" + env.GITHUB_REPOSITORY + "/releases/download/" + env.TAG + "/" + $name)) and
              any(.assets[]; .name == ($name + ".json"))' >/dev/null
          META_API_URL="$(printf '%s' "$RELEASE" | jq -r --arg name "$APK_NAME.json" '.assets[] | select(.name == $name) | .url')"
          META="$(gh api --header 'Accept: application/octet-stream' "$META_API_URL")"
          printf '%s' "$META" | jq -e --arg name "$APK_NAME" --arg sha "$SHA256" \
            --argjson code "$VERSION_CODE" --arg version "$VERSION_NAME" '
              .applicationId == "com.aurum.edge" and .artifactName == $name and
              .versionCode == $code and .sha256 == $sha and .versionName == $version' >/dev/null
          echo "::notice title=Public updater ready::$TAG code=$VERSION_CODE APK=$APK_NAME SHA-256=$SHA256 is listed in the public Release API with valid sidecar metadata."

      - name: Job summary
        if: always() && steps.guard.outputs.ready == 'true'
        run: |
          {
            echo "## Aurum Edge — Android APK"
            echo ""
            echo "### Versions"
            echo "| Item | Version |"
            echo "|---|---:|"
            echo "| App versionName | ${{ steps.collect.outputs.version_name }} |"
            echo "| App versionCode | ${{ steps.collect.outputs.version_code }} |"
            echo "| Java | ${JAVA_DISTRIBUTION} ${JAVA_VERSION} |"
            echo "| Android API | ${ANDROID_API_LEVEL} |"
            echo "| Android build-tools | ${ANDROID_BUILD_TOOLS} |"
            echo ""
            echo "### Quality gates"
            echo "Lint report: ${{ steps.lint.outcome }}. Tests and APK assembly are required to pass."
            echo ""
            echo "### Artifacts"
            echo "| File | Purpose | SHA-256 |"
            echo "|---|---|---|"
            echo "| \`${{ steps.collect.outputs.apk_name }}\` | Release APK for install/update | \`${{ steps.collect.outputs.sha256 }}\` |"
            echo "| \`${{ steps.collect.outputs.debug_apk_name }}\` | Debug APK with separate applicationId | \`${{ steps.collect.outputs.debug_sha256 }}\` |"
            echo "| \`${{ steps.collect.outputs.apk_name }}.json\` | Updater sidecar metadata | — |"
            echo ""
            echo "Release signing: ${AURUM_SIGNING_MODE:-prepared updater key}."
            if [[ "${AURUM_SIGNING_MODE:-}" == "GitHub Actions cache" ]]; then
              echo "The first install from this channel establishes the updater signature; later workflow builds reuse the cached key."
            fi
            echo ""
            echo "### Signing continuity (in-app updates need the SAME key)"
            echo "| Check | Value |"
            echo "|---|---|"
            echo "| Signing key cache hit | `${{ steps.signing_cache.outputs.cache-hit }}` |"
            echo "| New release APK signer SHA-256 | `${{ steps.signing_check.outputs.new_cert_sha256 }}` |"
            echo "| Published release APK signer SHA-256 | `${{ steps.signing_check.outputs.published_cert_sha256 }}` |"
            echo "| Verdict | ${{ steps.signing_check.outputs.continuity }} |"
            echo ""
            echo "No market or AI API keys are embedded in the APK. Users enter optional keys only on their own device."
          } >> "$GITHUB_STEP_SUMMARY"

  crypto-coverage:
    name: Audit exact USDT pairs (read-only)
    if: github.event_name == 'push' && github.ref == 'refs/heads/arena/20dbf868-ichimoko'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify probe invariants
        run: PYTHONPATH=tools python3 -m unittest discover -s tools -p 'test_probe_crypto_venues.py'
      - name: Audit Kraken and OKX public feeds, per symbol
        run: |
          timeout 9m python3 tools/probe_crypto_venues.py > crypto-venue-coverage.json
          python3 - <<'PY'
          import json, os
          data = json.load(open('crypto-venue-coverage.json'))
          rows = data['symbols']
          supported = sum(row['suggested'] is not None for row in rows.values())
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write(f"## Read-only market audit\n{supported}/{len(rows)} symbols passed a point-in-time runner probe. "
                      "This does NOT certify Android-device reachability, uninterrupted service, "
                      "or safe execution replay. Download the JSON artifact for per-symbol reasons.\n")
          PY
      - name: Expose per-symbol report through the GitHub Checks API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          report = json.load(open('crypto-venue-coverage.json'))
          payload = {
              'name': 'Read-only USDT venue coverage', 'head_sha': os.environ['GITHUB_SHA'],
              'status': 'completed', 'conclusion': 'neutral',
              'output': {'title': 'Point-in-time runner audit; not a trading authorization',
                         'summary': '```json\n' + json.dumps(report, ensure_ascii=False, separators=(',', ':')) + '\n```'}
          }
          subprocess.run(['gh', 'api', '-X', 'POST', f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs", '--input', '-'],
                         input=json.dumps(payload), text=True, stdout=subprocess.DEVNULL, check=True)
          PY
      - name: Attach audit report (not a venue authorization)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-venue-coverage
          path: crypto-venue-coverage.json
          if-no-files-found: warn
