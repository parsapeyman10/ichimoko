name: Windows Python Desktop

on:
  push:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-native.yml'
  pull_request:
    paths:
      - 'windows/**'
      - '.github/workflows/windows-native.yml'
  workflow_dispatch:

jobs:
  test-python-desktop-core:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify Python-only source contract
        shell: pwsh
        run: |
          $native = Get-ChildItem windows -Recurse -File -Include *.cpp,*.cc,*.cxx,*.h,*.hpp,CMakeLists.txt
          if ($native) {
            $native.FullName | ForEach-Object { Write-Host "::error::Unexpected native source: $_" }
            exit 1
          }
      - name: Compile Python modules
        run: python -m py_compile windows/aurum_core.py windows/aurum_edge.py windows/test_aurum_core.py
      - name: Deterministic core tests
        run: python windows/test_aurum_core.py
