<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><style>html,body,#chart{height:100%;width:100%;margin:0;background:#0b0e13;overflow:hidden}</style></head><body><div id="chart"></div>
<!-- Download and bundle this dependency locally before production release. -->
<script src="https://unpkg.com/lightweight-charts@4.2.2/dist/lightweight-charts.standalone.production.js"></script>
<script>
const chart = LightweightCharts.createChart(document.getElementById('chart'), {
  autoSize:true, layout:{background:{color:'#0b0e13'},textColor:'#707784'},
  grid:{vertLines:{color:'#171b23'},horzLines:{color:'#171b23'}},
  rightPriceScale:{borderColor:'#212630'},timeScale:{borderColor:'#212630',timeVisible:true}
});
const price = chart.addCandlestickSeries({upColor:'#24c69a',downColor:'#ef5d6c',borderVisible:false,wickUpColor:'#24c69a',wickDownColor:'#ef5d6c'});
const tenkan = chart.addLineSeries({color:'#57c7d4',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const kijun = chart.addLineSeries({color:'#9d83e9',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const ema200 = chart.addLineSeries({color:'#87909f',lineWidth:1,priceLineVisible:false,lastValueVisible:false});
const vwap = chart.addLineSeries({color:'#f4bd48',lineWidth:2,priceLineVisible:false,lastValueVisible:false});
let bars=[];
const mid=(i,p)=>{if(i<p-1)return null;const x=bars.slice(i-p+1,i+1);return (Math.max(...x.map(b=>b.high))+Math.min(...x.map(b=>b.low)))/2};
function studies(){
 let e=bars[0]?.close||0,pv=0,vol=0,t=[],k=[],em=[],vw=[];
 bars.forEach((b,i)=>{e=b.close*(2/201)+e*(199/201);const typ=(b.high+b.low+b.close)/3;pv+=typ*Math.max(b.volume,1);vol+=Math.max(b.volume,1);const a=mid(i,7),c=mid(i,22);if(a)t.push({time:b.time,value:a});if(c)k.push({time:b.time,value:c});em.push({time:b.time,value:e});vw.push({time:b.time,value:pv/vol})});
 tenkan.setData(t);kijun.setData(k);ema200.setData(em);vwap.setData(vw);
}
function receive(raw){const m=JSON.parse(raw);if(m.type==='bootstrap'){bars=m.candles;price.setData(bars);studies();chart.timeScale().fitContent()}if(m.type==='candle'){bars[bars.length-1]=m.candle;price.update(m.candle)}}
window.addEventListener('message',e=>receive(e.data));document.addEventListener('message',e=>receive(e.data));
chart.subscribeCrosshairMove(p=>{if(!p.time)return;const c=p.seriesData.get(price);window.ReactNativeWebView?.postMessage(JSON.stringify({type:'crosshair',candle:c}))});
</script></body></html>
